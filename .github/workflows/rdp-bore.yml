name: Kanda RDP (Bore)

on:
  workflow_dispatch:
    inputs:
      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime (max 360; default 355)"
        required: false
        default: "355"
      rdp_count:
        description: "How many RDP instances (1-4)"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: |
          $n = [int]"${{ inputs.rdp_count }}"; if ($n -lt 1) { $n = 1 }; if ($n -gt 4) { $n = 4 }
          $inc = @(); for ($i=1; $i -le $n; $i++){ $inc += @{ id = $i } }
          "matrix=$(@{ include = $inc } | ConvertTo-Json -Compress)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 4
    timeout-minutes: 370
    env:
      RDP_USER: Kandagawa
      RDP_PASS: Kandagw@12345
    steps:

      - name: Decide hostname
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) { $hn = "kanda${{ matrix.id }}" } else { $hn = "kanda" }
          "RDP_HOSTNAME=$hn" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Hostname: $hn"

      - name: Enable RDP user + firewall
        run: |
          $secFile = "$env:TEMP\secedit.cfg"; $secNew = "$env:TEMP\secedit_new.cfg"
          secedit /export /cfg $secFile /quiet 2>$null
          if (Test-Path $secFile) {
            (Get-Content $secFile) -replace 'PasswordComplexity = 1','PasswordComplexity = 0' -replace 'MinimumPasswordLength = \d+','MinimumPasswordLength = 0' | Set-Content $secNew
            secedit /configure /db secedit.sdb /cfg $secNew /quiet 2>$null
          }
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
            Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      - name: Tune RDP + graphics performance
        run: |
          try {
            reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f | Out-Null
            reg add "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fAllowFontSmoothing /t REG_DWORD /d 0 /f | Out-Null
            reg add "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fDisableAnimations /t REG_DWORD /d 1 /f | Out-Null
            reg add "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" /v AllowFontSmoothing /t REG_DWORD /d 0 /f | Out-Null
            reg add "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" /v Win32PrioritySeparation /t REG_DWORD /d 38 /f | Out-Null
            reg add "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" /v HwSchMode /t REG_DWORD /d 2 /f | Out-Null
            Set-MpPreference -DisableRealtimeMonitoring $true -EA SilentlyContinue
            Set-MpPreference -DisableBehaviorMonitoring $true -EA SilentlyContinue
            Set-MpPreference -DisableScanOnRealtimeEnable $true -EA SilentlyContinue
            Set-MpPreference -DisableIOAVProtection $true -EA SilentlyContinue
            Stop-Service -Name WinDefend -Force -EA SilentlyContinue
            Stop-Service -Name WdNisSvc -Force -EA SilentlyContinue
            $svcs = @("AzureArcSysTray","bfe","DiagTrack","WSearch","SysMain","DPS","TabletInputService","WMPNetworkSvc")
            foreach($svc in $svcs){ Stop-Service -Name $svc -Force -EA SilentlyContinue; Set-Service -Name $svc -StartupType Disabled -EA SilentlyContinue }
            reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f | Out-Null
            Write-Host "[+] RDP + graphics performance tuned"
          } catch { Write-Host ("[!] Tune lỗi: " + $_.Exception.Message) }

      - name: Remove bloatware + desktop shortcuts (Unity Hub, R)
        run: |
          Stop-Process -Name "Unity Hub" -Force -EA SilentlyContinue
          Stop-Process -Name "unityhub" -Force -EA SilentlyContinue
          Stop-Process -Name "Rgui" -Force -EA SilentlyContinue
          Stop-Process -Name "Rterm" -Force -EA SilentlyContinue
          $dirs=@("$env:ProgramFiles\Unity Hub","$env:LOCALAPPDATA\Unity Hub","$env:APPDATA\UnityHub","$env:ProgramData\Unity Hub","$env:LOCALAPPDATA\Programs\Unity Hub")
          foreach($x in $dirs){ if(Test-Path $x){ Remove-Item $x -Recurse -Force -EA SilentlyContinue } }
          $desktops = @("$env:PUBLIC\Desktop", "$env:PUBLIC\Public Desktop", "$env:USERPROFILE\Desktop")
          $targets = @("Unity Hub", "R 4.6.1", "R 4.4", "Rgui")
          foreach($d in $desktops){
            if(Test-Path $d){
              Get-ChildItem -Path $d -Filter *.lnk -EA SilentlyContinue | ForEach-Object {
                $nm = $_.BaseName
                foreach($t in $targets){ if($nm -like "*$t*"){ Remove-Item $_.FullName -Force -EA SilentlyContinue; Write-Host "[+] Xoá shortcut: $($_.Name)" } }
              }
            }
          }
          Write-Host "[+] Bloatware + shortcuts cleanup done"

      - name: Download bore
        run: |
          $zip = "$env:TEMP\bore.zip"
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\bore" -Force
          $exe = Get-ChildItem "$env:TEMP\bore" -Recurse -Filter bore.exe | Select-Object -First 1
          Copy-Item $exe.FullName "$env:TEMP\bore.exe" -Force
          & "$env:TEMP\bore.exe" --version
          Write-Host "[+] bore downloaded"

      - name: Bore tunnel 3389 -> bore.pub + keep alive (supervisor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mins = if ("${{ inputs.quick_test }}" -eq "true") { 5 } else { [int]"${{ inputs.runtime_minutes }}" }
          if ($mins -gt 360) { $mins = 360 }
          $deadline = (Get-Date).AddMinutes($mins)
          $exe = "$env:TEMP\bore.exe"
          $lastPort = $null
          while ((Get-Date) -lt $deadline) {
            $alive = $false
            if (Test-Path "$env:TEMP\bore.pid") {
              $pid2 = Get-Content "$env:TEMP\bore.pid" -EA SilentlyContinue
              $p2 = Get-Process -Id $pid2 -EA SilentlyContinue
              if ($p2) { $alive = $true }
            }
            if (-not $alive) {
              if ($lastPort) { Write-Host "[bore] tunnel chết -> restart" }
              Remove-Item "$env:TEMP\bore.out","$env:TEMP\bore.err" -Force -EA SilentlyContinue
              $p = Start-Process -FilePath $exe -ArgumentList "local","3389","--to","bore.pub" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:TEMP\bore.out" -RedirectStandardError "$env:TEMP\bore.err"
              $p.Id | Out-File "$env:TEMP\bore.pid" -Encoding ascii
              $port = $null
              for ($i=0; $i -lt 20; $i++) {
                Start-Sleep -Seconds 1
                if (Test-Path "$env:TEMP\bore.out") {
                  $m = Select-String -Path "$env:TEMP\bore.out" -Pattern "bore\.pub[\s:]+(\d+)" | Select-Object -First 1
                  if ($m) { $port = $m.Matches[0].Groups[1].Value; break }
                }
                if ($p.HasExited) { break }
              }
              if ($port) {
                $lastPort = $port
                "BORE_PORT=$port" | Out-File -Append $env:GITHUB_ENV
                Write-Host "======================================================"
                Write-Host "  RDP READY — CONNECT INFO"
                Write-Host "  Host : bore.pub"
                Write-Host "  Port : $port"
                Write-Host "  User : $env:RDP_USER"
                Write-Host "  Pass : $env:RDP_PASS"
                Write-Host "  (mstsc -> bore.pub : $port)"
                Write-Host "======================================================"
                "### RDP READY — kết nối mstsc: **bore.pub : $port** (user $env:RDP_USER)" | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
                # Publish port vao repo de bot doc ngay (API log 404 khi job dang chay)
                try {
                  $rid = "${{ matrix.id }}"
                  $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("bore.pub:$port"))
                  $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
                  $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/rdp-ports/$($env:GITHUB_RUN_ID)-$rid.txt"
                  for ($try=1; $try -le 6; $try++) {
                    $sha = $null
                    try { $sha = (Invoke-RestMethod -Uri $api -Headers $hdr -ErrorAction SilentlyContinue).sha } catch { $sha = $null }
                    $body = @{ message = "port $rid = $port"; content = $b64 }
                    if ($sha) { $body.sha = $sha }
                    try {
                      Invoke-RestMethod -Method Put -Uri $api -Headers $hdr -Body ($body | ConvertTo-Json) -ContentType "application/json" -ErrorAction Stop | Out-Null
                      Write-Host "[port] published rdp-ports/$($env:GITHUB_RUN_ID)-$rid.txt = bore.pub:$port"
                      break
                    } catch {
                      Write-Host "[port] publish loi (lan $try): $($_.Exception.Message)"
                      Start-Sleep -Seconds 5
                    }
                  }
                  # Cap nhat README.md voi thong tin ket noi cua may nay
                  # (moi job chi sua DONG cua minh -> merge an toan khi chay 4 may)
                  $rline = "- **RDP #$rid**: ``bore.pub:$port`` - User: ``$env:RDP_USER`` / Pass: ``$env:RDP_PASS``"
                  for ($try=1; $try -le 6; $try++) {
                    $rsha = $null; $rtxt = $null
                    try {
                      $rm = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/README.md" -Headers $hdr -ErrorAction Stop
                      $rsha = $rm.sha
                      $rtxt = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($rm.content -replace "\s","")))
                    } catch {}
                    if (-not $rtxt) { $rtxt = "# RDP`n" }
                    if ($rtxt -notmatch "## Ket noi RDP") { $rtxt = $rtxt.TrimEnd() + "`n`n## Ket noi RDP`n" }
                    $pat = ("^- \*\*RDP #" + $rid + "\*\*:")
                    $lines = @(($rtxt -split "`r?`n") | Where-Object { $_ -notmatch $pat })
                    $newLines = @(); $done = $false
                    foreach ($ln in $lines) {
                      $newLines += $ln
                      if (-not $done -and $ln -match "^## Ket noi RDP") { $newLines += ""; $newLines += $rline; $done = $true }
                    }
                    if (-not $done) { $newLines += ""; $newLines += $rline }
                    $rnew = ($newLines -join "`n")
                    $rb64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($rnew))
                    $rbody = @{ message = "RDP #$rid ready: bore.pub:$port"; content = $rb64 }
                    if ($rsha) { $rbody.sha = $rsha }
                    try {
                      Invoke-RestMethod -Method Put -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/README.md" -Headers $hdr -Body ($rbody | ConvertTo-Json) -ContentType "application/json" -ErrorAction Stop | Out-Null
                      Write-Host "[readme] updated RDP #$rid -> bore.pub:$port"
                      break
                    } catch {
                      Write-Host "[readme] loi (lan $try): $($_.Exception.Message)"
                      Start-Sleep -Seconds 5
                    }
                  }
                } catch { Write-Host "[port] publish loi: $($_.Exception.Message)" }
              } else {
                Write-Host "[bore] chưa lấy được port, thử lại..."
                if ($p.HasExited) {
                  Get-Content "$env:TEMP\bore.err" -EA SilentlyContinue | Write-Host
                  Start-Sleep -Seconds 5
                }
              }
            }
            Start-Sleep -Seconds 15
          }
          Write-Host "[bore] hết runtime, kết thúc"
